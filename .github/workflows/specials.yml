name: Особые видео Фантано
on:
  schedule:
    - cron: "37 22 * * 0"   # раз в неделю, поздно вечером: дневные брифы новых обзоров уже потратили свою квоту Gemini
  workflow_dispatch:
    inputs:
      calls:
        description: "Сколько роликов дать посмотреть Gemini за запуск"
        default: "3"

permissions:
  contents: write

concurrency:
  group: specials
  cancel-in-progress: false

jobs:
  specials:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        # data/*.json live in a private repo (the datasets are not to be downloadable in one click); the code is public
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Списки, рейтинги, фразы и любимые треки из роликов
        timeout-minutes: 55
        run: python -m lmn.specials
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # not the briefs' first model, and at most 3 videos a run: briefs for new reviews keep their quota
          GEMINI_MODEL: gemini-3.7-flash,gemini-3.5-flash
          SPECIALS_GEMINI_CALLS: ${{ inputs.calls || '3' }}
      - name: Сохранить
        if: ${{ always() }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in data/specials.json data/notes.json data/albums.json; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet && exit 0
          git commit -q -m "data: особые видео и описания роликов Фантано"
          for i in 1 2 3 4; do  # the hourly check may have pushed meanwhile
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить особые видео в main"; exit 1
      - name: Даты обзоров по видео на YouTube
        # its own commit on a fresh archive.json: check.py appends to it twice an hour, so each retry starts from
        # origin/main again and recomputes instead of rebasing a stale copy
        if: ${{ hashFiles('video_dates.json') != '' }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            (cd "$GITHUB_WORKSPACE" && python -m lmn.notes dates video_dates.json)
            git add data/archive.json
            git diff --cached --quiet && exit 0
            git commit -q -m "data: даты обзоров архива по видео на YouTube"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить даты архива в main"; exit 1
