name: Сайт
on:
  push:
    branches: [main]
    paths: [site_src/**, lmn/**, .github/workflows/pages.yml]
  workflow_run:
    workflows: ["Проверка новых обзоров", "Оценки критиков из Википедии", "Досье артистов", "Особые видео Фантано", "Брифы для архива", "Ссылки на Apple Music", "Деплой Cloudflare Worker"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false   # a run after a check that changed nothing ends in seconds; it must not cancel a real build

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Данные из приватного репозитория
        # data/*.json live in a private repo (the datasets are not to be downloadable in one click); the code is public
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - name: Есть ли что публиковать
        id: decide
        # After an hourly check, rebuild only if it committed something: the data repo got a commit after that run started.
        run: |
          last=$(git -C .data log -1 --format=%ct)
          started=$(date -d "${{ github.event.workflow_run.run_started_at }}" +%s 2>/dev/null || echo 0)
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$last" -lt "$started" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Проверка ничего не изменила, сайт тот же"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.decide.outputs.go == 'true'
        with:
          python-version: "3.12"
      - run: python -m lmn.site
        if: steps.decide.outputs.go == 'true'
      - name: Сайт на Cloudflare Pages
        # The site's only home since 2026-11-02 (an address without the owner's name). A failure turns the run red: the
        # previous deploy stays up, but the site doesn't get the new data.
        id: cf
        if: steps.decide.outputs.go == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx --yes wrangler@4.45.0 pages project create laziest-music-nerd --production-branch main || true
          npx --yes wrangler@4.45.0 pages deploy _site --project-name laziest-music-nerd --branch main --commit-dirty=true | tee cf.log
          # wrangler prints this deploy's own address, https://<hash>.<project>.pages.dev; the site lives at <project>.pages.dev
          url=$(grep -oE 'https://[a-z0-9-]+\.[a-z0-9-]+\.pages\.dev' cf.log | tail -1 | sed -E 's#^https://[^.]+\.#https://#')
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Сайт на Cloudflare: $url" >> "$GITHUB_STEP_SUMMARY"
      # The old GitHub Pages address (danmnv.github.io/laziest-music-nerd) is no longer deployed (2026-11-10). Its last
      # deploy stays up for good: every old page there sends the reader to the same page here (lmn/redirect.py built it).
      # Nothing reads from it any more, and new pages were never linked there. Redeploying it on every build only failed
      # whenever GitHub still counted the previous deploy as in progress (often ~20–45 min), turning runs red.
