name: Сайт
on:
  push:
    branches: [main]
    paths: [site_src/**, lmn/**, .github/workflows/pages.yml]
  workflow_run:
    workflows: ["Проверка новых обзоров", "Оценки критиков из Википедии", "Досье артистов", "Особые видео Фантано"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.decide.outputs.go }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Есть ли что публиковать
        id: decide
        # After an hourly check, rebuild only if it committed something (main moved past the commit it checked).
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Проверка ничего не изменила, сайт тот же"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.decide.outputs.go == 'true'
        with:
          python-version: "3.12"
      - run: python -m lmn.site
        if: steps.decide.outputs.go == 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.decide.outputs.go == 'true'
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
