name: Брифы для архива
on:
  # Только вручную. Бриф пишет бесплатная модель по-английски (Groq; Mistral, если пополнить баланс), Gemini переводит
  # по 10 за запрос, не больше 15 запросов за запуск, чтобы новым обзорам хватило дневной квоты Gemini.
  # Что не успеет за 5,5 часа, сохранится, остальное следующим запуском.
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько обзоров за запуск (весь архив — 3400; запуск сам остановится через 5,5 часа и сохранит сделанное)"
        default: "300"
      compare:
        description: "Только сравнить три способа на 10 свежих обзорах без брифа (ничего не сохраняет)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: briefs
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Брифы по текстам обзоров с theneedledrop.com
        timeout-minutes: 345
        run: python -m lmn.briefs
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
          # not the first models: new reviews' briefs keep their quota
          GEMINI_MODEL: gemini-3.5-flash,gemini-3.5-flash-lite
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRIEFS_LIMIT: ${{ inputs.limit || '300' }}
          BRIEFS_MINUTES: "330"   # GitHub stops a job after 6 hours; this leaves time to save
          BRIEFS_COMPARE: ${{ inputs.compare && '1' || '' }}
      - name: Сохранить
        if: ${{ always() && !inputs.compare }}
        run: |
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/briefs.json ] && git add data/briefs.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: брифы для архива"
          for i in 1 2 3 4; do  # the hourly check may have pushed meanwhile
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить брифы в main"; exit 1
