name: Брифы для архива
on:
  schedule:
    - cron: "17 1 * * *"   # каждую ночь: следующая порция архива, пока все обзоры не получат бриф
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько обзоров за запуск"
        default: "300"
      compare:
        description: "Только сравнить модели на 10 обзорах (ничего не сохраняет)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: briefs
  cancel-in-progress: false

jobs:
  briefs:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Брифы по текстам обзоров с theneedledrop.com
        timeout-minutes: 110
        run: python -m lmn.briefs
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          BRIEFS_LIMIT: ${{ inputs.limit || '300' }}
          BRIEFS_COMPARE: ${{ inputs.compare && '1' || '' }}
      - name: Сохранить
        if: ${{ always() && !inputs.compare }}
        run: |
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/briefs.json ] && git add data/briefs.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: брифы для архива"
          for i in 1 2 3 4; do  # the hourly check may have pushed meanwhile
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить брифы в main"; exit 1
