name: Ссылки на Bandcamp
on:
  schedule:
    - cron: "17 4 * * 2"   # раз в неделю (вт): новые обзоры и повтор ненайденных через 90 дней
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько обзоров проверить за запуск (500 ≈ 40 минут: MusicBrainz отвечает раз в секунду)"
        default: "500"

permissions:
  contents: write

concurrency:
  group: bandcamp
  cancel-in-progress: false

jobs:
  bandcamp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        # data/*.json live in a private repo (the datasets are not to be downloadable in one click); the code is public
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Найти ссылки
        timeout-minutes: 50
        run: python -m lmn.bandcamp
        env:
          BANDCAMP_LIMIT: ${{ inputs.limit || '500' }}
      - name: Сохранить
        if: ${{ always() }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bandcamp.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: ссылки на Bandcamp"
          for i in 1 2 3 4; do  # the hourly check may have pushed meanwhile
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить ссылки в main"; exit 1
