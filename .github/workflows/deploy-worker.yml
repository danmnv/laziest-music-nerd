name: Деплой Cloudflare Worker
on:
  push:
    branches: [main]
    paths: [worker/**, .github/workflows/deploy-worker.yml]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skips quietly until the Cloudflare secrets are added.
    if: ${{ vars.CLOUDFLARE_READY == '1' || github.event_name == 'workflow_dispatch' }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
      WRANGLER: npx --yes wrangler@4.45.0
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Проверить секреты
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TELEGRAM_BOT_TOKEN; do
            [ -n "${!s}" ] || { echo "::error::Нет секрета $s"; exit 1; }
          done
      - name: База D1
        run: |
          ID=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="laziest-music-nerd") | .uuid')
          if [ -z "$ID" ]; then
            $WRANGLER d1 create laziest-music-nerd
            ID=$($WRANGLER d1 list --json | jq -r '.[] | select(.name=="laziest-music-nerd") | .uuid')
          fi
          sed -i "s/REPLACED_BY_DEPLOY_WORKFLOW/$ID/" wrangler.toml
          $WRANGLER d1 execute laziest-music-nerd --remote --file schema.sql
      - name: Владелец бота
        id: owner
        run: |
          OWNER="$TELEGRAM_OWNER_ID"
          if [ -z "$OWNER" ]; then
            # Works only while no webhook is set, i.e. on the first deploy. Later runs read it back from D1.
            OWNER=$(curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/getUpdates" | jq -r '[.result[]?.message? | select(.chat.type=="private") | .chat.id] | unique | if length==1 then .[0] else empty end')
          fi
          if [ -z "$OWNER" ]; then
            OWNER=$($WRANGLER d1 execute laziest-music-nerd --remote --json --command "SELECT value FROM settings WHERE key='owner_id'" | jq -r '.[0].results[0].value // empty')
          fi
          [ -n "$OWNER" ] || { echo "::error::Не нашёл владельца. Напиши боту /start и запусти деплой снова, либо добавь секрет TELEGRAM_OWNER_ID."; exit 1; }
          echo "::add-mask::$OWNER"
          $WRANGLER d1 execute laziest-music-nerd --remote --command "INSERT INTO settings (key,value) VALUES ('owner_id','$OWNER') ON CONFLICT(key) DO UPDATE SET value=excluded.value; INSERT OR IGNORE INTO users (user_id, started_at) VALUES ($OWNER, datetime('now'));"
          echo "id=$OWNER" >> "$GITHUB_OUTPUT"
      - name: Деплой
        id: deploy
        run: |
          derive() { printf '%s' "$TELEGRAM_BOT_TOKEN:$1" | sha256sum | cut -c1-48; }
          $WRANGLER deploy | tee deploy.log
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::Не вижу адрес Worker. Открой dash.cloudflare.com → Workers & Pages один раз, чтобы Cloudflare создал поддомен workers.dev, и запусти снова."; exit 1; }
          printf '%s' "$TELEGRAM_BOT_TOKEN" | $WRANGLER secret put TELEGRAM_BOT_TOKEN
          printf '%s' "$(derive webhook)" | $WRANGLER secret put WEBHOOK_SECRET
          printf '%s' "$(derive session)" | $WRANGLER secret put SESSION_SECRET
          printf '%s' "$(derive actions)" | $WRANGLER secret put ACTIONS_SECRET
          printf '%s' "${{ steps.owner.outputs.id }}" | $WRANGLER secret put OWNER_ID
          curl -s "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
            --data-urlencode "url=$URL/tg" \
            --data-urlencode "secret_token=$(derive webhook)" \
            --data-urlencode 'allowed_updates=["message","callback_query"]' | jq '{ok, description}'
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Записать адрес Worker
        working-directory: .
        run: |
          mkdir -p data
          echo '${{ steps.deploy.outputs.url }}' > data/worker_url.txt
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/worker_url.txt
          git diff --cached --quiet && exit 0
          git commit -q -m "data: адрес Worker"
          for i in 1 2 3 4; do  # main may have moved meanwhile (a merged PR): rebase our data commit on top
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить базу в main"; exit 1
