name: Описания старых обзоров по видео
on:
  # Каждый день (с 08.11.2026): бесплатный Gemini смотрит видео старых обзоров, у которых на theneedledrop.com только
  # одна строка, и пишет полное описание вместо пересказа этой строки. Новым обзорам остаётся запас дневного лимита.
  schedule:
    - cron: "40 8 * * *"   # каждый день в 8:40 UTC, вскоре после того, как у Gemini обновился дневной лимит (полночь по Калифорнии)
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько обзоров за запуск (пусто — сколько позволит дневная доля лимита)"
        default: ""

permissions:
  contents: write

concurrency:
  group: briefs   # the same file as «Брифы для архива»: one at a time
  cancel-in-progress: false

jobs:
  videobriefs:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Описания по видео
        timeout-minutes: 280
        run: python -m lmn.videobriefs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # only the videos' lengths
          VIDEO_LIMIT: ${{ inputs.limit }}
          VIDEO_MINUTES: "300"   # of the free tier's 8 hours of video a day: the rest is for new reviews
          VIDEO_PER_MODEL: "12"   # requests a day on each model: the rest is for new reviews
          PYTHONUNBUFFERED: "1"
      - name: Сохранить
        if: ${{ always() }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/briefs.json ] && git add data/briefs.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: описания старых обзоров по видео"
          for i in 1 2 3 4; do  # the hourly check may have pushed meanwhile
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить описания в main"; exit 1
