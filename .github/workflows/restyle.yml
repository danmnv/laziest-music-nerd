name: Обновить старые посты канала
# Разово (Даниил, 02.11.2026): все посты канала в нынешнем виде — кнопки только для действий, ссылки текстом под
# треклистом. Подписчикам уведомлений нет: это правка постов. Повторный запуск ничего не меняет.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: check-reviews   # не одновременно с проверкой новых обзоров: обе пишут data/reviews.json
  cancel-in-progress: false

jobs:
  restyle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        # data/*.json live in a private repo (the datasets are not to be downloadable in one click); the code is public
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Переписать посты
        timeout-minutes: 25
        run: python -m lmn.restyle
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          SITE_LIVE: ${{ vars.SITE_LIVE }}
          WORKER_LIVE: ${{ vars.WORKER_LIVE }}
      - name: Сохранить
        if: ${{ always() }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/reviews.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: посты канала в новом виде"
          for i in 1 2 3 4; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить в main"; exit 1
