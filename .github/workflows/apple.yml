name: Ссылки на Apple Music
on:
  schedule:
    - cron: "41 5 * * *"   # каждый день: сначала весь архив (~900 альбомов за запуск), потом новые обзоры и повтор ненайденных
  workflow_dispatch:
    inputs:
      limit:
        description: "Сколько альбомов проверить за запуск (900 ≈ 47 минут: Apple отвечает примерно 20 раз в минуту)"
        default: "900"

permissions:
  contents: write

concurrency:
  group: apple
  cancel-in-progress: false

jobs:
  apple:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        # data/*.json live in a private repo (the datasets are not to be downloadable in one click); the code is public
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Найти ссылки
        timeout-minutes: 52
        run: python -m lmn.apple
        env:
          APPLE_LIMIT: ${{ inputs.limit || '900' }}
          LOOKUP_MINUTES: "48"
      - name: Сохранить
        if: ${{ always() }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -f data/apple.json ] && git add data/apple.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: ссылки на Apple Music"
          for i in 1 2 3 4; do  # the hourly check may have pushed meanwhile
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить ссылки в main"; exit 1
