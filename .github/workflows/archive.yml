name: Архив оценок из YouTube
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check-reviews   # never at the same time as the hourly check: both write data/
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m lmn.yt_archive
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          git diff --cached --quiet || (git commit -m "data: оценки архива из YouTube" && git push)
