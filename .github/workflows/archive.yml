name: Архив оценок из YouTube
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: check-reviews   # never at the same time as the hourly check: both write data/
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        # data/*.json live in a private repo (the datasets are not to be downloadable in one click); the code is public
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m lmn.yt_archive
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: оценки архива из YouTube"
          for i in 1 2 3 4; do  # main may have moved meanwhile (a merged PR): rebase our data commit on top
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить базу в main"; exit 1
