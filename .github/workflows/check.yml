name: Проверка новых обзоров
on:
  schedule:
    - cron: "17 * * * *"   # каждый час в :17
  workflow_dispatch:
    inputs:
      mode:
        description: "run — как обычно; test — карточка свежего обзора только тебе в личку; dry — ничего не отправлять"
        default: run
        type: choice
        options: [run, test, dry]

permissions:
  contents: write

concurrency:
  group: check-reviews
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Проверить TND и отправить карточки
        timeout-minutes: 25   # leaves time for the save step below even if this one hangs
        run: python -m lmn.check
        env:
          MODE: ${{ inputs.mode || 'run' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}  # new reviews are noticed on YouTube first
          ODESLI_API_KEY: ${{ secrets.ODESLI_API_KEY }}
          SITE_LIVE: ${{ vars.SITE_LIVE }}
          WORKER_LIVE: ${{ vars.WORKER_LIVE }}
      - name: Сохранить базу
        # always(): cards already posted must be saved even if the check failed or hit its timeout later,
        # otherwise the next hour would post them again.
        if: ${{ always() && (inputs.mode || 'run') == 'run' }}
        run: |
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -q -m "data: новые обзоры"
          for i in 1 2 3 4; do  # main may have moved meanwhile (a merged PR): rebase our data commit on top
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить базу в main"; exit 1
