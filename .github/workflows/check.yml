name: Проверка новых обзоров
on:
  schedule:
    - cron: "17,47 * * * *"   # дважды в час по расписанию; на деле GitHub запускает примерно раз в час (10.11.2026: промежутки 44–77 минут), поэтому слотов два
  workflow_dispatch:
    inputs:
      mode:
        description: "run — как обычно; test — карточка свежего обзора только тебе в личку; dry — ничего не отправлять"
        default: run
        type: choice
        options: [run, test, dry]

permissions:
  contents: read   # commits go to the data repo with DATA_TOKEN; this repo is only read

concurrency:
  group: check-reviews
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        # data/*.json live in a private repo (the datasets are not to be downloadable in one click); the code is public
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5   # for the Worker's compact copy of the archive in the save step
        with:
          node-version: 22
      - name: Проверить TND и отправить карточки
        timeout-minutes: 40   # Gemini may take up to 20 min on a video (gemini.VIDEO_BUDGET_SEC), started up to 12 min in; leaves time for the save step below even if this one hangs
        run: python -m lmn.check
        env:
          MODE: ${{ inputs.mode || 'run' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}  # new reviews are noticed on YouTube first
          ODESLI_API_KEY: ${{ secrets.ODESLI_API_KEY }}
          SITE_LIVE: ${{ vars.SITE_LIVE }}
          WORKER_LIVE: ${{ vars.WORKER_LIVE }}
          QUIET_HOURS: "1-9"            # обзор, вышедший с 1:00 до 9:00 по Москве, уходит в канал в 9:00 (без ночных уведомлений)
          QUIET_TZ: Europe/Moscow
      - name: Сохранить базу
        # always(): cards already posted must be saved even if the check failed or hit its timeout later,
        # otherwise the next hour would post them again.
        if: ${{ always() && (inputs.mode || 'run') == 'run' }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The bot reads data/archive.min.json, a compact copy of archive.json (worker/src/archive.mjs: reading the
          # whole archive.json costs the Worker several times its 10 ms of CPU). Made here on every run, so it follows
          # archive.json within an hour whichever workflow changed it. If it can't be made, the old copy is taken out
          # of the repo (the bot then reads archive.json itself: slower, but not an old archive), the data is saved all the
          # same and the run ends red.
          packed=ok
          node "$GITHUB_WORKSPACE/worker/tools/pack-archive.mjs" data/archive.json data/archive.min.json || packed=bad
          [ "$packed" = ok ] || git rm -q -f --ignore-unmatch data/archive.min.json
          finish() {
            [ "$packed" = ok ] && exit 0
            echo "::error::Не собралась data/archive.min.json: бот читает archive.json (медленнее). Чинить worker/tools/pack-archive.mjs"; exit 1
          }
          git add data/
          git diff --cached --quiet && finish
          git commit -q -m "data: новые обзоры"
          for i in 1 2 3 4; do  # main may have moved meanwhile (a merged PR): rebase our data commit on top
            git pull --rebase -q origin main && git push -q origin HEAD:main && finish
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить базу в main"; exit 1
