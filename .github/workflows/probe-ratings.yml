name: probe ratings (temporary)
on:
  push:
    branches: [claude/project-thread-by13b7]
    paths: [lmn/ratings.py, .github/workflows/probe-ratings.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Live run on recent reviews + a slice of the archive (not saved)
        env:
          RATINGS_LIMIT: "260"
        run: |
          python -u -m lmn.ratings
          python - <<'PY'
          import json, collections
          from lmn import ratings
          st = json.load(open("data/ratings.json"))
          arch = {r["id"]: r for r in json.load(open("data/archive.json"))}
          rev = {r["id"]: r for r in json.load(open("data/reviews.json"))}
          arch.update(rev)
          by = collections.defaultdict(list)
          for k, e in st.items():
              by[arch[k]["published"][:4]].append(e)
          for y, es in sorted(by.items()):
              n = len(es); f = lambda c: sum(1 for e in es if c(e))
              print(y, n, "wp", f(lambda e: e.get("wp")), "critics>0", f(lambda e: e.get("critics")), "critics>=5", f(lambda e: len(e.get("critics", [])) >= 5),
                    "mc", f(lambda e: e.get("metacritic") is not None), "charts", f(lambda e: e.get("charts")), "certs", f(lambda e: e.get("certs")),
                    "sales", f(lambda e: any(c.get("sales") for c in e.get("certs", []))))
          for k in list(rev)[:40]:
              e = st.get(k)
              print("-", rev[k]["artist_name"], "—", rev[k]["album"], "|", ratings.card_line(e) or "(нет)", "|", ratings.sales_line(e))
          print("length of longest card line:", max(len(ratings.card_line(e)) for e in st.values()))
          PY
