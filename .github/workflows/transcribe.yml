name: Расшифровки старых обзоров по видео
on:
  # Каждый день (с 08.11.2026): бесплатный Gemini записывает, что Фантано говорит в видео старых обзоров, у которых на
  # theneedledrop.com только одна строка. По расшифровке «Брифы для архива» (GPT-6 Luna) потом пишут полное описание
  # вместо пересказа этой строки. Новым обзорам остаётся запас дневного лимита Gemini.
  schedule:
    - cron: "40 8 * * *"   # каждый день в 8:40 UTC, вскоре после того, как у Gemini обновился дневной лимит (полночь по Калифорнии); «Брифы» в 9:30 ждут конца этого запуска
  workflow_dispatch:
    inputs:
      key_check:
        description: "Проверить архивный ключ и доступность моделей без обработки видео"
        type: boolean
        default: false
      limit:
        description: "Сколько обзоров за запуск (пусто — сколько позволит дневная доля лимита)"
        default: ""
      compare:
        description: "Только сравнить расшифровку Gemini с текстом сайта на N новых обзорах (ничего не сохраняет)"
        default: ""
      probe:
        description: "Только проверить, что модели отвечают на эти обзоры (id через запятую; ничего не сохраняет)"
        default: ""
      cards:
        description: "Только сравнить карточки трёх последних новых обзоров: эта модель против нынешних (ничего не сохраняет)"
        default: ""
      retell:
        description: "Пересказ вместо дословной записи для видео, от которых модели отказались (с probe: пересказ этих обзоров, ничего не сохраняет)"
        type: boolean
        default: true

permissions:
  contents: read   # commits go to the data repo with DATA_TOKEN; this repo is only read

concurrency:
  # The metadata check does not access data and can run without taking the archive writers' lock.
  group: ${{ inputs.key_check && 'archive-gemini-key-check' || 'briefs' }}
  cancel-in-progress: false

env:
  GEMINI_MODEL: gemini-3.5-flash-lite,gemini-3.1-flash-lite,gemini-3.6-flash,gemini-4-hydrogen

jobs:
  check-key:
    if: ${{ inputs.key_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Проверить доступ к моделям Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.ARCHIVE_GEMINI_API_KEY }}
        run: |
          python - <<'PYTHON'
          import os
          from lmn.doctor import check, gemini_models

          if not os.environ.get("GEMINI_API_KEY", "").strip():
              raise SystemExit("ARCHIVE_GEMINI_API_KEY is missing")
          ok = check("archive Gemini models", lambda: gemini_models(require_all=True))
          raise SystemExit(0 if ok else 1)
          PYTHON

  transcribe:
    if: ${{ !inputs.key_check }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - name: Данные из приватного репозитория
        uses: actions/checkout@v5
        with:
          repository: ${{ vars.DATA_REPO || 'danmnv/laziest-music-nerd-data' }}
          token: ${{ secrets.DATA_TOKEN }}
          path: .data
      - run: ln -sfn .data/data data
        working-directory: .
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Расшифровки по видео
        timeout-minutes: 280
        run: python -m lmn.transcribe
        env:
          GEMINI_API_KEY: ${{ secrets.ARCHIVE_GEMINI_API_KEY }}   # a separate Google project from new reviews
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}   # only the videos' lengths
          VIDEO_LIMIT: ${{ inputs.limit }}
          VIDEO_MINUTES: "360"   # includes retries; leave room in the archive project for other video jobs
          VIDEO_PER_LITE_MODEL: "24"
          VIDEO_PER_MODEL: "8"   # 3.6 Flash has a smaller daily quota than the Lite models
          TRANSCRIBE_RETELL_MODEL: gemini-4-hydrogen
          VIDEO_PER_RETELL_MODEL: "4"   # start with a small pilot for retellings after a transcript refusal
          TRANSCRIBE_COMPARE: ${{ inputs.compare }}
          TRANSCRIBE_PROBE: ${{ inputs.probe }}
          TRANSCRIBE_CARDS: ${{ inputs.cards }}
          TRANSCRIBE_RETELL: ${{ inputs.retell }}   # empty on the schedule = on (13.11.2026); "false" from a manual run = off
          PYTHONUNBUFFERED: "1"
      - name: Сохранить
        if: ${{ always() && !inputs.compare && !inputs.probe && !inputs.cards }}
        run: |
          cd "$GITHUB_WORKSPACE/.data"   # the data repo: commits go there
          git config user.name "laziest-music-nerd-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ -d data/transcripts ] && git add data/transcripts
          [ -f data/briefs.json ] && git add data/briefs.json
          git diff --cached --quiet && exit 0
          git commit -q -m "data: расшифровки старых обзоров по видео"
          for i in 1 2 3 4; do  # the hourly check may have pushed meanwhile
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "::error::Не смог сохранить расшифровки в main"; exit 1
